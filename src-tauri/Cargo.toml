[package]
name = "keynest"
version = "0.0.0"
description = "A local-first password and API key vault"
authors = ["Keynest Contributors"]
license = "MIT"
repository = "https://github.com/xtianyaa/Keynest"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keepass = { version = "0.12.9", features = ["save_kdbx4"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
